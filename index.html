<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.json"><title>Life RPG</title>
<style>
body{margin:0;background:#090d18;color:#f8fafc;font-family:system-ui;padding:16px}.app{max-width:760px;margin:auto}.card{background:#12192a;border:1px solid #25314a;border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center}.muted{color:#94a3b8;font-size:13px}.level{font-size:42px;font-weight:900}.bar{height:12px;background:#263249;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#8b5cf6}.quest{padding:12px 0;border-bottom:1px solid #25314a;display:flex;gap:10px;align-items:center}.quest input{width:20px;height:20px;accent-color:#8b5cf6}.xp{margin-left:auto;color:#c4b5fd;font-weight:800}button,input{padding:10px;border-radius:10px;border:1px solid #334155}input{background:#0a1020;color:white}button{background:#8b5cf6;color:white;font-weight:800;border:0}form{display:grid;grid-template-columns:1fr 70px auto;gap:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0e1524;padding:12px;border-radius:12px}.big{font-size:24px;font-weight:900}@media(max-width:500px){form{grid-template-columns:1fr 65px auto}}
</style></head><body><div class="app">
<h1>⚔️ LIFE RPG</h1><div class="muted">Your real life is the game.</div>
<div class="card"><div class="row"><div><div class="muted">PLAYER</div><div class="big" id="name">Ronin</div></div><div><div class="muted">LEVEL</div><div class="level" id="level">1</div></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="row muted"><span id="xp">0 / 100 XP</span><span id="total">Total: 0 XP</span></div></div>
<div class="stats"><div class="stat"><div class="muted">🔥 STREAK</div><div class="big" id="streak">0</div></div><div class="stat"><div class="muted">⚔️ TODAY</div><div class="big" id="today">0</div></div><div class="stat"><div class="muted">🏆 DONE</div><div class="big" id="done">0</div></div></div>
<div class="card"><div class="row"><h2>⚔️ Today's Quests</h2><button onclick="rename()">Player</button></div><div id="quests"></div><form onsubmit="add(event)"><input id="qn" placeholder="New quest" required><input id="qx" type="number" min="1" max="100" value="10" required><button>Add</button></form></div>
<div class="card"><h2>🏆 Achievements</h2><div id="ach"></div></div>
<div class="card"><button onclick="backup()">Export Backup</button> <button onclick="restore()">Import Backup</button> <button onclick="reset()">Reset</button></div>
<div class="muted" style="text-align:center">Life RPG V1</div>
</div>
<script>
const K="life-rpg-v1";const defaults=[["Wake up on time",10],["Complete study block",30],["Finish homework / school work",20],["Skill learning",25],["Physical activity",15],["Plan tomorrow",5]];
let s=JSON.parse(localStorage.getItem(K)||"null")||{name:"Ronin",xp:0,quests:defaults.map((q,i)=>({id:i,n:q[0],x:q[1]})),days:{}};
const day=()=>new Date().toISOString().slice(0,10);function d(){return s.days[day()]||(s.days[day()]={})}function save(){localStorage.setItem(K,JSON.stringify(s))}
function render(){let z=d(),lv=Math.floor(s.xp/100)+1,cur=s.xp%100;name.textContent=s.name;level.textContent=lv;xp.textContent=cur+" / 100 XP";total.textContent="Total: "+s.xp+" XP";fill.style.width=cur+"%";let tx=0,doneN=0;quests.innerHTML="";s.quests.forEach(q=>{let checked=!!z[q.id];if(checked){tx+=q.x;doneN++}let r=document.createElement("div");r.className="quest";r.innerHTML='<input type="checkbox" '+(checked?"checked":"")+'><span>'+q.n+'</span><span class="xp">+'+q.x+' XP</span>';r.querySelector("input").onchange=()=>{z[q.id]=!checked;s.xp+=checked?-q.x:q.x;if(s.xp<0)s.xp=0;save();render()};quests.appendChild(r)});today.textContent=tx;done.textContent=doneN;let st=0,t=new Date();while(true){let k=t.toISOString().slice(0,10),a=s.days[k];if(!a||!Object.values(a).some(Boolean))break;st++;t.setDate(t.getDate()-1)}streak.textContent=st;ach.innerHTML=[s.xp>=100?"🆙 Level 2":"🔒 Level 2",s.xp>=500?"⭐ 500 XP":"🔒 500 XP",st>=3?"🔥 3 Day Streak":"🔒 3 Day Streak",st>=7?"🔥 7 Day Streak":"🔒 7 Day Streak"].map(x=>"<span style='display:inline-block;background:#202a40;padding:8px;margin:4px;border-radius:9px'>"+x+"</span>").join("");save()}
function add(e){e.preventDefault();s.quests.push({id:"q"+Date.now(),n:qn.value.trim(),x:+qx.value});e.target.reset();render()}function rename(){let n=prompt("Player name:",s.name);if(n)s.name=n.trim();render()}function backup(){let b=new Blob([JSON.stringify(s)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="life-rpg-backup.json";a.click()}function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{s=JSON.parse(r.result);render();alert("Backup restored.")}catch{alert("Invalid backup.")}};r.readAsText(i.files[0])};i.click()}function reset(){if(confirm("Reset everything?")){localStorage.removeItem(K);location.reload()}}render();
</script></body></html>
